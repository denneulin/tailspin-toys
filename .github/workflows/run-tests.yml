name: "Run tests"

# Run tests on pull requests to main, on pushes to main and to the fallback
# branches the participants fetch during the training (secours/*).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "secours/**"]
  workflow_dispatch:

# Cancel superseded in-progress runs for the same ref so rapid pushes don't
# queue behind stale runs (saves runner time and gives faster feedback).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI runs quiet and reproducible.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  # What a participant's machine runs during the training, on Windows and on
  # Linux: a clean install, the unit tests, the lint, the types and the build.
  # No Playwright here: the training machines install no test browser.
  workstation:
    name: "Workstation (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run ESLint
        run: npm run lint

      - name: Run type-check (tsgo)
        run: npm run typecheck

      # prebuild runs db:migrate + db:seed, so this also checks the database setup.
      - name: Build the site
        run: npm run build

      # A seed that silently did nothing would still build, with an empty
      # catalog. Count the games in the database the build used; the home page
      # may be prerendered or rendered on demand, so its HTML can't tell.
      - name: Check the seed filled the database
        run: >-
          node -e "const { DatabaseSync } = require('node:sqlite');
          const n = new DatabaseSync('tailspin.db').prepare('SELECT count(*) AS n FROM games').get().n;
          console.log('Games in tailspin.db:', n);
          if (n === 0) process.exit(1);"

  # Type-check the codebase: pure TypeScript via the native TS 7 compiler (tsgo,
  # from @typescript/native-preview) and .astro files via astro check (which runs
  # on the classic TypeScript package). Linting is unaffected by either.
  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      # tsgo (TS 7) for .ts + astro sync/check (classic TS) for .astro
      - name: Run type-check
        run: npm run typecheck:all

  # Build the static site and run the Playwright end-to-end suite against it
  frontend-tests:
    runs-on: ubuntu-latest
    # Run inside Playwright's official image so the browsers and their OS-level
    # dependencies are preinstalled. This is the approach recommended by the
    # Playwright CI docs (https://playwright.dev/docs/ci) and avoids the slow,
    # network-variable `playwright install --with-deps` apt step on each run.
    # The tag MUST match the @playwright/test version in package-lock.json
    # so the bundled browsers resolve; bump it whenever Playwright is upgraded.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      # The Playwright config's webServer builds the static site (prebuild runs
      # db:migrate + db:seed) and serves it via `astro preview` before the suite.
      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
